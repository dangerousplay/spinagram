# Neutral built-in theme. Organisation themes live outside this repository and
# usually start with `extends: default`, overriding only what differs.
name: default

canvas: {width: 1920, height: 1080, background: white, margin: 80}

colors:
  white: "#FFFFFF"
  primary: "#2563EB"
  primary-strong: "#1E40AF"
  primary-deep: "#172554"
  primary-soft: "#DBEAFE"
  primary-bg: "#EFF6FF"
  accent-on-dark: "#93C5FD"
  warning: "#F59E0B"
  warning-bg: "#FFFBEB"
  warning-soft: "#FEF3C7"
  warning-text: "#92400E"
  alert: "#EA580C"
  alert-bg: "#FFF7ED"
  alert-soft: "#FFEDD5"
  alert-text: "#C2410C"
  success: "#059669"
  success-bg: "#ECFDF5"
  success-text: "#047857"
  text: "#1F2937"
  text-muted: "#4B5563"
  gray: "#6B7280"
  border: "#D1D5DB"
  neutral-soft: "#F3F4F6"

# Font roles. `files` maps "<weight>" or "<weight>italic" to a font file relative to
# the theme directory (used for metrics and embedding). `figma` maps weights to Figma
# style names. Without files, metrics fall back to a width heuristic.
fonts:
  heading: {family: "Arial", fallback: "Helvetica, sans-serif", figma: {"400": Regular, "700": Bold}}
  body: {family: "Arial", fallback: "Helvetica, sans-serif", figma: {"400": Regular, "700": Bold}}

# Icons: `dir` relative to the theme; `pattern` placeholders {name} and {variant}.
# `variants` maps a background tone to the variant suffix to use on it.
# `prefer_vendor_for_services: true` draws the cached vendor pack icon of a service named in a node title
# instead of a generic icon (default false: `check` only hints it as `icon-generic-for-service`).
icons: {dir: null, pattern: "{name}-{variant}.png", variants: {light: dark, dark: light}}
#   prefer_vendor_for_services: false

# Text: `glyph_map` replaces characters the fonts lack (char → replacement) in every text before layout,
# merged through `extends`; `check` reports each replaced character as `glyph-mapped`. Default: none.
# text: {glyph_map: {"→": "->", "✓": "OK"}}

styles:
  node:
    default: {fill: white, stroke: primary, title: primary-strong, body: text-muted, tone: light}
    dark: {fill: primary-deep, stroke: primary-deep, title: accent-on-dark, body: primary-soft, tone: dark}
    soft: {fill: primary-bg, stroke: primary, title: primary-deep, body: text-muted, tone: light}
    warning: {fill: warning-bg, stroke: warning, title: warning-text, body: text-muted, tone: light}
    alert: {fill: alert-bg, stroke: alert, title: alert-text, body: text-muted, tone: light}
    neutral: {fill: white, stroke: border, title: text, body: text-muted, tone: light}
  edge:
    default: primary-strong
    dark: primary-deep
    alert: alert
    warning: warning
    gray: gray
    light: primary-soft
  zone:
    soft: {fill: primary-soft, label: primary-deep}
    warning: {fill: warning-soft, label: warning-text}
    alert: {fill: alert-soft, label: alert-text}
    neutral: {fill: neutral-soft, label: text-muted}
    # behavior diagrams: composite states, orthogonal regions, swimlanes, typed regions
    state:    {fill: primary-bg, stroke: primary, stroke_width: 2, label: primary-deep, radius: 18, opacity: 1, upper: false}
    region:   {fill: none, stroke: gray, stroke_width: 1.5, dashed: true, label: text-muted, radius: 12, upper: false}
    lane:     {fill: none, stroke: border, stroke_width: 1.5, label: primary-deep, radius: 0, upper: false}
    behavior: {fill: neutral-soft, label: text-muted, opacity: 1, upper: false}
    # AWS Architecture Icons groups (icons from the `aws` pack): outline, no fill, corner icon flush with the
    # outline (header inset: false keeps the AWS convention).
    aws-cloud:   {fill: none, stroke: "#242F3E", label: "#242F3E", icon: "aws:group-aws-cloud", radius: 0, upper: false, header: {inset: false}}
    aws-account: {fill: none, stroke: "#E7157B", label: "#E7157B", icon: "aws:group-aws-account", radius: 0, upper: false, header: {inset: false}}
    aws-region:  {fill: none, stroke: "#00A4A6", dashed: true, label: "#00A4A6", icon: "aws:group-region", radius: 0, upper: false, header: {inset: false}}
    aws-vpc:     {fill: none, stroke: "#8C4FFF", label: "#8C4FFF", icon: "aws:group-virtualprivatecloud-vpc", radius: 0, upper: false, header: {inset: false}}
    aws-az:      {fill: none, stroke: "#147EBA", dashed: true, label: "#147EBA", radius: 0, upper: false}
    aws-subnet:  {fill: "#E6F6F7", stroke: "#00A4A6", label: "#007B7D", icon: "aws:group-privatesubnet", radius: 0, upper: false, header: {inset: false}, opacity: 1}
  legend:
    default: primary
    dark: primary-deep
    warning: warning
    alert: alert
    gray: gray
    soft: primary-soft
  table:
    header_fill: primary-deep
    header_text: white
    row_fills: [white, primary-bg]
    border: border
    first_col_text: primary-strong
    text: text-muted

# Aliases let specs written for another theme keep working (e.g. `green` → `default`).
aliases: {}

defaults:
  node: {radius: 22, stroke_width: 3, note_stroke_width: 2, padding: 22, title_size: 24, body_size: 18,
         icon_size: 44, icon_size_center: 40, icon_scale: 0.26, icon_max: 88, icon_gap: 14, title_leading: 1.15, body_leading: 1.32, title_body_gap: 10,
         auto: {min_w: 220, max_w: 360, min_h: 96}}   # size of nodes without w/h under `layout:`
  # centred icons (align: center): `icon_text_gap` px between the icon and the title, `icon_min` the smallest
  # size the icon shrinks to before the box grows (px). Defaults:
  #   node: {icon_text_gap: 8, icon_min: 24}
  diamond: {title_size: 21, leading: 1.22, style: soft}
  edge: {width: 3.5, label_size: 17, arrow: true}
  zone: {radius: 26, opacity: 0.6, label_size: 16}
  table: {row_height: 100, header_height: 52, font_size: 16, header_size: 19, icon_size: 36, radius: 14}
  legend: {size: 18, swatch: 20}
  # annotation band (legend and steps panels), step badges and callout bubbles (px)
  annotations: {band: 360, gap: 32, padding: 22, radius: 18, title_size: 20, text_size: 16, row_gap: 12,
                swatch_w: 46, swatch_h: 28, badge: 30, badge_size: 15, callout_width: 320, callout_gap: 36}
  # automatic layout: gap between siblings in a group, group padding, engine spacing (px)
  layout: {gap: 40, padding: 24, node_gap: 48, rank_gap: 80}

chrome:
  bar: {height: 10, color: primary}
  title: {x: 80, y: 92, size: 46, color: primary, font: heading}
  subtitle: {x: 80, y: 134, size: 23, color: text-muted, font: body}
  kicker: {template: "{id}", x_right: 80, y: 60, size: 16, color: gray, letter_spacing: 2}
  footer: {rule_y_from_bottom: 70, rule_color: border, logo: null, logo_size: [128, 38],
           source_size: 15, source_color: gray}
