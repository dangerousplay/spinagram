# A hand-placed diagram made to be edited on the canvas (`spinagram serve`, Canvas): three nested zones, a row, a
# column, ten icon nodes and labelled edges. Drag nodes between zones, drag a zone to move its children, group
# nodes as a row or a column, drop icons from the palette. Render: spinagram render examples/showcase/editable_platform.yaml
id: EDIT01
title: Editable platform
subtitle: Hand-placed on a grid, so every node, zone and group can be moved on the canvas
stylesheets: [showcase.css, aws.css, editable_platform.css]

zones:
  - {id: region, label: "AWS · eu-west-1", class: region, x: 56, y: 175, w: 1584, h: 821, children: [vpc, users, cdn, queue, bucket, monitor]}
  - {id: vpc, label: "VPC 10.0.0.0/16", class: vpc, x: 96, y: 356, w: 984, h: 600, children: [app, data]}
  - {id: app, label: "App tier", class: app, x: 136, y: 416, w: 346, h: 500, children: [alb, api, worker]}
  - {id: data, label: "Data tier", class: data, x: 740, y: 416, w: 300, h: 348, children: [db, cache]}

nodes:
  - {id: users, title: Users, text: Browsers and apps, icon: "network:internet", class: external}
  - {id: cdn, title: CloudFront, text: Edge cache and TLS, icon: "aws:cloudfront", class: edge-service}
  - {id: alb, title: Load balancer, text: Application LB, icon: "aws:elastic-load-balancing", class: load-balancer}
  - {id: api, title: Orders API, text: ECS service, icon: "aws:amazon-elastic-container-service", class: app-tier}
  - {id: worker, title: Billing worker, text: Lambda, icon: "aws:aws-lambda", class: app-tier}
  - {id: db, title: Orders DB, text: Aurora PostgreSQL, at: [780, 628, 220, 96], icon: "aws:amazon-aurora", class: database}
  - {id: cache, title: Session cache, text: ElastiCache, at: [780, 476, 220, 96], icon: "aws:elasti-cache", class: database}
  - {id: queue, title: Order events, text: SQS, at: [1380, 780, 220, 96], icon: "aws:amazon-simple-queue-service", class: app-tier}
  - {id: bucket, title: Reports, text: S3, at: [1380, 628, 220, 96], icon: "aws:amazon-simple-storage-service", class: storage}
  - {id: monitor, title: Monitoring, text: CloudWatch, at: [1380, 476, 220, 96], icon: "aws:cloud-watch", class: edge-service}

rows:
  - {x: 96, y: 236, gap: 120, nodes: [users, cdn]}
columns:
  - {x: 176, y: 476, gap: 56, nodes: [alb, api, worker]}

edges:
  - {from: users, to: cdn, label: HTTPS, route: ortho}
  - {from: cdn.bottom, to: alb.top, label: origin, route: ortho}
  - {from: alb, to: api, label: forward, route: ortho}
  - {from: alb, to: cache, label: sessions, route: ortho}
  - {from: api, to: db, label: SQL, route: ortho}
  - {from: db, to: bucket, label: export, route: ortho}
  - {from: cache, to: monitor, label: metrics, route: ortho}
  - {from: queue, to: worker, label: consume, route: ortho}
