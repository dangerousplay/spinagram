id: EX2
title: When does a change need review?
subtitle: YAML example with shorthand edges
source: Example diagram · spinagram
zones:
  - {x: 60, y: 180, w: 1800, h: 380, label: Automatic, color: soft}
nodes:
  - {id: start, at: [100, 280, 320, 180], style: dark, title: Change registered}
  - {id: known, kind: diamond, at: [520, 260, 300, 220], title: "Seen before?"}
  - {id: std, at: [1000, 260, 360, 130], title: Standard path, text: No manual step}
  - {id: tg, at: [900, 400, 360, 130], style: warning, title: Technical review, text: "Asks rollback, window, owner"}
  - {id: extra, title: "Extra", x: 100, y: 600, w: 200, h: 100}
edges:
  - start -> known
  - "known.right -> std.left: yes"
  - "known.bottom -> tg.left: no"
  - "start -> extra: new"
legend:
  x: 100
  y: 640
  items:
    - {color: default, label: automatic}
    - {color: warning, label: review}
    - {color: alert, label: board}
