[package]
name = "spinagram-core"
description = "spinagram engine core: text measurement and fitting (spike)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
skrifa = "0.49"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
base64 = "0.22"
resvg = "0.49"
selectors = "0.41"
cssparser = "0.38"
precomputed-hash = "0.1"
html-escape = "0.2"
compensated-summation = "0.3"
vstd = "=0.0.0-2026-10-25-0158"

[package.metadata.verus]
verify = true

[lints]
workspace = true
