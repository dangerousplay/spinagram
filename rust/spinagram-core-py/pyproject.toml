[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "spinagram-core"
description = "Rust core for spinagram: text fitting, edge routing, SVG/PNG drawing and the CSS cascade"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "spinagram_core._core"
features = ["pyo3/extension-module"]

[tool.uv]
# `uv sync` in the repository rebuilds the core when any Rust source changes, not only this file
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
    { file = "../spinagram-core/Cargo.toml" },
    { file = "../spinagram-core/src/**/*.rs" },
]
