[package]
name = "spinagram-core-py"
description = "Python bindings for spinagram-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
spinagram-core = { path = "../spinagram-core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
