name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.10.4"
  BUN_VERSION: "1.4.2"

jobs:
  web:
    name: UI bundle (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build # tsc -b && vite build -> src/spinagram/ui/static
        working-directory: web
      - name: Committed bundle matches web/
        run: |
          if [ -n "$(git status --porcelain -- src/spinagram/ui/static)" ]; then
            git status --short -- src/spinagram/ui/static
            echo "::error::src/spinagram/ui/static is stale: run 'bun run build' in web/ and commit it"
            exit 1
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv run --locked --only-group dev ruff check src tests examples

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  rust:
    name: Rust core (tests, wheel, suite with SPINAGRAM_RUST=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: cargo test
        working-directory: rust
      - name: Clippy (all deny, pedantic warn, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
      - name: Build the spinagram-core wheel
        run: uvx maturin build --release -o ../target/wheels
        working-directory: rust/spinagram-core-py
      - run: uv sync --locked --all-extras
      - name: Install the wheel
        run: uv pip install --reinstall rust/target/wheels/spinagram_core-*.whl
      - name: Python suite against the Rust core
        run: SPINAGRAM_RUST=1 uv run --no-sync pytest -q
      - name: Routing parity and speed
        run: uv run --no-sync python rust/bench/route_parity.py
      - name: SVG parity (the PNG comparison needs Chromium and is skipped here)
        run: uv run --no-sync python rust/bench/svg_png_parity.py --svg-only
      - name: CSS parity and speed
        run: uv run --no-sync python rust/bench/css_parity.py
      - name: Text parity and speed
        run: uv run --no-sync python rust/bench/parity.py

  verus:
    name: Verus proofs (spinagram-core)
    runs-on: ubuntu-latest
    env:
      VERUS_VERSION: "0.2026.10.26.d17fbd0"
      VERUS_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Verus's pinned Rust toolchain
        run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal
      - name: Download Verus
        run: |
          curl -fsSL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$HOME/verus-dl"
          echo "$(dirname "$(find "$HOME/verus-dl" -name cargo-verus -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Verify spinagram-core
        run: cargo verus verify -p spinagram-core
        working-directory: rust

  # One abi3 wheel per target serves CPython 3.11+. Cross-compiled where the runner can: Linux aarch64 and both
  # musllinux targets in maturin's cross images, macOS x86_64 from the arm64 runner, Windows arm64 from x64.
  core-wheels:
    name: spinagram-core wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/spinagram-core-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: core-wheel-${{ matrix.name }}
          path: rust/spinagram-core-py/dist/*.whl
          if-no-files-found: error

  core-sdist:
    name: spinagram-core sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/spinagram-core-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: core-sdist
          path: rust/spinagram-core-py/dist/*.tar.gz
          if-no-files-found: error

  # Install each wheel on a runner of its own platform and render examples with and without the core.
  core-wheel-smoke:
    name: spinagram-core wheel smoke (${{ matrix.name }})
    needs: core-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: core-wheel-${{ matrix.name }}
          path: dist
      - run: python -m pip install . dist/*.whl
      - run: python rust/bench/wheel_smoke.py

  core-musllinux-smoke:
    name: spinagram-core wheel smoke (musllinux-x86_64, import)
    needs: core-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-wheel-musllinux-x86_64
          path: dist
      - name: Import in Alpine
        run: |
          docker run --rm -v "$PWD/dist:/dist" python:3.13-alpine sh -c \
            'pip install -q /dist/*.whl && python -c "import spinagram_core as c; print(c.__version__)"'

  # Where no wheel matches, pip builds spinagram-core from the sdist with the local Rust toolchain.
  core-source-install:
    name: spinagram-core from source (${{ matrix.os }})
    needs: core-sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: dist
      - name: Build and install from the sdist
        run: python -m pip install . --no-binary spinagram-core dist/*.tar.gz
      - run: python rust/bench/wheel_smoke.py

  build:
    name: Build sdist + wheel (uv)
    needs: [web, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build
      - name: Wheel ships the UI bundle
        run: unzip -l dist/*.whl | grep -q 'spinagram/ui/static/index.html'
      - name: Smoke test the built wheel
        run: |
          uv run --isolated --no-project --with "$(ls dist/*.whl)[ui]" spinagram --help
          uv run --isolated --no-project --with "$(ls dist/*.whl)" spinagram render examples/decision.yaml -f svg -o /tmp/out
          test -n "$(ls /tmp/out/*.svg)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
