name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.10.4"
  BUN_VERSION: "1.4.2"

jobs:
  web:
    name: UI bundle (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: wasm-bindgen CLI (the version of the wasm-bindgen crate in Cargo.lock)
        id: wbg
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,""); print}' rust/Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build spinagram-wasm (web/src/wasm, rust/spinagram-wasm/pkg-node)
        run: bash rust/spinagram-wasm/build.sh
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build # tsc -b && vite build -> src/spinagram/ui/static (ignored by git)
        working-directory: web
      - name: Keep the bundle for the wheels and the sdist
        uses: actions/upload-artifact@v4
        with:
          name: ui-static
          path: src/spinagram/ui/static
          if-no-files-found: error

  wasm:
    name: spinagram-wasm (build, bun tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: wasm-bindgen CLI (the version of the wasm-bindgen crate in Cargo.lock)
        id: wbg
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,""); print}' rust/Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build spinagram-wasm (web/src/wasm, rust/spinagram-wasm/pkg-node)
        run: bash rust/spinagram-wasm/build.sh
      - run: bun test
        working-directory: rust/spinagram-wasm
      - run: cargo build -p spinagram-wasm --target wasm32-unknown-unknown --release
        working-directory: rust

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv run --locked --only-group dev ruff check src tests examples

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable # uv builds the spinagram._core extension from rust/ with maturin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  rust:
    name: Rust core (tests, lints, parity, pure-Python suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: cargo test
        working-directory: rust
      - name: Clippy (all deny, pedantic warn, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
      - run: uv sync --locked --all-extras
      - name: Python suite on the pure-Python reference engine
        run: SPINAGRAM_RUST=0 uv run --no-sync pytest -q
      - name: Routing parity and speed
        run: uv run --no-sync python rust/bench/route_parity.py
      - name: SVG parity (the PNG comparison needs Chromium and is skipped here)
        run: uv run --no-sync python rust/bench/svg_png_parity.py --svg-only
      - name: CSS parity and speed
        run: uv run --no-sync python rust/bench/css_parity.py
      - name: Text parity and speed
        run: uv run --no-sync python rust/bench/parity.py

  verus:
    name: Verus proofs (spinagram-core)
    runs-on: ubuntu-latest
    env:
      VERUS_VERSION: "0.2026.10.26.d17fbd0"
      VERUS_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Verus's pinned Rust toolchain
        run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal
      - name: Download Verus
        run: |
          curl -fsSL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$HOME/verus-dl"
          echo "$(dirname "$(find "$HOME/verus-dl" -name cargo-verus -type f | head -1)")" >> "$GITHUB_PATH"
      - name: Verify spinagram-core
        run: cargo verus verify -p spinagram-core
        working-directory: rust

  # spinagram is one package with a compiled Rust extension (spinagram._core). One abi3 wheel per target serves
  # CPython 3.11+. Cross-compiled where the runner can: Linux aarch64 and both musllinux targets in maturin's
  # cross images, macOS x86_64 from the arm64 runner, Windows arm64 from x64.
  # macOS runs on macos-15, not macos-latest: the macOS 26 arm64 pool behind macos-latest often has no free runner
  # and GitHub cancels the queued job after about 15 minutes.
  wheels:
    name: Wheel (${{ matrix.name }})
    needs: web # the UI bundle is built once there and not committed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-15, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-static
          path: src/spinagram/ui/static
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ui-static
          path: src/spinagram/ui/static
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Install each wheel on a runner of its own platform: the UI bundle and CLI are there, and examples render
  # byte-identically with and without the Rust core.
  wheel-smoke:
    name: Wheel smoke (${{ matrix.name }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - run: python -m pip install "$(ls dist/*.whl)[ui]"
      - name: Wheel ships the UI bundle and the CLI runs
        run: |
          python -c "from importlib.resources import files; assert (files('spinagram') / 'ui/static/index.html').is_file()"
          spinagram --help > /dev/null
      - run: python rust/bench/wheel_smoke.py

  musllinux-smoke:
    name: Wheel smoke (musllinux-x86_64, import)
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-musllinux-x86_64
          path: dist
      - name: Import in Alpine
        run: |
          docker run --rm -v "$PWD/dist:/dist" python:3.13-alpine sh -c \
            'pip install -q /dist/*.whl && python -c "from spinagram import _core, rust; assert rust.core() is _core"'

  # Where no wheel matches, pip builds spinagram from the sdist with the local Rust toolchain.
  source-install:
    name: Install from source (${{ matrix.os }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Build and install from the sdist
        run: python -m pip install --no-binary spinagram dist/*.tar.gz
      - run: python rust/bench/wheel_smoke.py
