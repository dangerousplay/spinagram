name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.10.4"
  BUN_VERSION: "1.4.2"

jobs:
  web:
    name: UI bundle (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build # tsc -b && vite build -> src/spinagram/ui/static
        working-directory: web
      - name: Committed bundle matches web/
        run: |
          if [ -n "$(git status --porcelain -- src/spinagram/ui/static)" ]; then
            git status --short -- src/spinagram/ui/static
            echo "::error::src/spinagram/ui/static is stale: run 'bun run build' in web/ and commit it"
            exit 1
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv run --locked --only-group dev ruff check src tests examples

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  build:
    name: Build sdist + wheel (uv)
    needs: [web, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build
      - name: Wheel ships the UI bundle
        run: unzip -l dist/*.whl | grep -q 'spinagram/ui/static/index.html'
      - name: Smoke test the built wheel
        run: |
          uv run --isolated --no-project --with "$(ls dist/*.whl)[ui]" spinagram --help
          uv run --isolated --no-project --with "$(ls dist/*.whl)" spinagram render examples/decision.yaml -f svg -o /tmp/out
          test -n "$(ls /tmp/out/*.svg)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
