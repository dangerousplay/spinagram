name: Release

# Push a tag that matches the version in pyproject.toml, with the changelog regenerated for it. spinagram-core is
# released in lockstep: bump rust/Cargo.toml and the spinagram-core pin in pyproject.toml to the same version
# (tests/test_rust_default.py fails when they differ).
#   uv version --bump minor
#   uvx git-cliff --tag "v$(uv version --short)" -o CHANGELOG.md
#   git commit -am "chore(release): v$(uv version --short)"
#   git tag "v$(uv version --short)" && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spinagram/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no API token stored
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git-cliff reads the whole history and the tags
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - name: Tag matches project and core versions
        run: |
          v="$(uv version --short)"
          core="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -1)"
          if [ "v$v" != "$GITHUB_REF_NAME" ] || [ "$core" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject version $v and rust/Cargo.toml version $core must agree"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4 # every spinagram-core wheel plus its sdist
        with:
          pattern: core-*
          path: core/
          merge-multiple: true
      # spinagram pins spinagram-core, so the core goes up first
      - name: Publish spinagram-core
        run: uv publish --trusted-publishing always core/*
      - name: Publish spinagram
        run: uv publish --trusted-publishing always dist/*
      # The newest section of the committed changelog. `git-cliff --latest` would split at the
      # last pre-release tag even though cliff.toml ignores it, leaving a final release almost empty.
      - name: Release notes (CHANGELOG.md)
        run: awk '/^## \[/ { n++ } n == 1' CHANGELOG.md > RELEASE_NOTES.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* core/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $pre
