name: Release

# Push a tag that matches the version in pyproject.toml, with the changelog regenerated for it:
#   uv version --bump minor
#   uvx git-cliff --tag "v$(uv version --short)" -o CHANGELOG.md
#   git commit -am "chore(release): v$(uv version --short)"
#   git tag "v$(uv version --short)" && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spinagram/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no API token stored
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git-cliff reads the whole history and the tags
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - name: Tag matches project version
        run: |
          v="$(uv version --short)"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $v"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always
      # The newest section of the committed changelog. `git-cliff --latest` would split at the
      # last pre-release tag even though cliff.toml ignores it, leaving a final release almost empty.
      - name: Release notes (CHANGELOG.md)
        run: awk '/^## \[/ { n++ } n == 1' CHANGELOG.md > RELEASE_NOTES.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $pre
