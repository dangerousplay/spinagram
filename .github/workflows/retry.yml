name: Retry runner shortages

# A hosted runner that never picks a job up leaves it queued until GitHub cancels it, about 15 minutes later, with
# the annotation "The job was not acquired by Runner of type hosted even after multiple attempts". When that is the
# only reason a CI or Release run failed, re-run its failed jobs (a Release re-run then publishes as usual), up to
# four attempts in all. Any other failure is left for a person.
on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  actions: write # re-run the jobs
  checks: read # read the jobs' annotations

jobs:
  retry:
    name: Re-run jobs no runner picked up
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
      && github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Re-run when every failed job was never picked up by a runner
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.id) \(.name)"')
          if [ -z "$failed" ]; then
            echo "No failed jobs."
            exit 0
          fi
          while read -r id name; do
            if ! gh api "repos/$REPO/check-runs/$id/annotations" --jq '.[].message' \
                | grep -q "was not acquired by Runner"; then
              echo "$name failed for another reason; not retrying."
              exit 0
            fi
            echo "$name was never picked up by a runner."
          done <<< "$failed"
          gh run rerun "$RUN" --failed -R "$REPO"
          echo "Re-ran the failed jobs of run $RUN."
