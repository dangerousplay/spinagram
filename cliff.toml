# git-cliff configuration: CHANGELOG.md from Conventional Commits.
#   uvx git-cliff -o CHANGELOG.md                     # regenerate (unreleased changes on top)
#   uvx git-cliff --tag v0.2.0 -o CHANGELOG.md        # before tagging a release
#   uvx git-cliff --latest --strip header             # notes for the latest tag (used by release.yml)

[changelog]
header = """
# Changelog

All notable changes to spinagram are listed here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project uses
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). Generated by
[git-cliff](https://git-cliff.org) from Conventional Commits.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/dangerousplay/spinagram/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = false  # the first few commits predate the convention: listed under "Other"
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^docs\\(specs\\)", skip = true },          # internal planning notes
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge (branch|pull request)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^(chore|style)", group = "<!-- 7 -->Maintenance" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
