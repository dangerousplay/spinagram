site_name: spinagram
site_description: Diagrams as code, rendered editable to SVG, PNG, PowerPoint and Figma.
site_url: https://dangerousplay.github.io/spinagram/
repo_url: https://github.com/dangerousplay/spinagram
repo_name: dangerousplay/spinagram
edit_uri: edit/main/docs/
exclude_docs: |
  diagrams/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Automatic layout: auto-layout.md
      - Manual layout: manual-layout.md
      - Icon packs: icons.md
      - Themes: themes.md
      - Facts: facts.md
  - Outputs:
      - Backends: outputs.md
      - Figma and FigJam: figma.md
  - Tools:
      - CLI: cli.md
      - Live UI: live-ui.md
  - Extending: extending.md
  - Development: development.md
