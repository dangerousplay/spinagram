<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><title>Architecture decisions</title><defs><style></style><filter id="sh0" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.1"/></filter><filter id="sh1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350F" flood-opacity="0.15"/></filter></defs><rect width="1920" height="1080" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1920.0" height="10.0" rx="0" fill="#2563EB"/><rect x="80.0" y="200.0" width="540.0" height="210.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh0)"/><rect x="80.0" y="214.0" width="6.0" height="182.0" rx="3" fill="#2563EB"/><rect x="690.0" y="200.0" width="540.0" height="210.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh0)"/><rect x="690.0" y="214.0" width="6.0" height="182.0" rx="3" fill="#2563EB"/><rect x="1300.0" y="200.0" width="540.0" height="210.0" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#sh0)"/><rect x="1300.0" y="214.0" width="6.0" height="182.0" rx="3" fill="#2563EB"/><rect x="80.0" y="520.0" width="1150.0" height="300.0" rx="12" fill="#EFF6FF"/><rect x="1300.0" y="520.0" width="540.0" height="140.0" rx="6" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5" filter="url(#sh1)"/><rect x="1300.0" y="680.0" width="540.0" height="140.0" rx="6" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5" filter="url(#sh1)"/><image x="102.0" y="277.7" width="54.6" height="54.6" href="data:image/svg+xml;base64,"/><text x="170.6" y="273.5" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="170.6" dy="0.0">Aurora PostgreSQL</tspan></text><text x="170.6" y="306.5" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="170.6" dy="0.0">Managed backups and point-in-time recovery; a</tspan><tspan x="170.6" dy="22.4">reader in a second zone takes reporting load</tspan><tspan x="170.6" dy="22.4">off the writer.</tspan></text><image x="712.0" y="277.7" width="54.6" height="54.6" href="data:image/svg+xml;base64,"/><text x="780.6" y="284.8" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="780.6" dy="0.0">ECS on Fargate</tspan></text><text x="780.6" y="317.7" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="780.6" dy="0.0">No hosts to patch; tasks scale on CPU and queue</tspan><tspan x="780.6" dy="22.4">depth, and deploys roll per zone.</tspan></text><image x="1322.0" y="277.7" width="54.6" height="54.6" href="data:image/svg+xml;base64,"/><text x="1390.6" y="273.5" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="1390.6" dy="0.0">CloudFront and WAF</tspan></text><text x="1390.6" y="306.5" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1390.6" dy="0.0">Static assets and TLS at the edge; managed</tspan><tspan x="1390.6" dy="22.4">rules stop the noisy part of the internet</tspan><tspan x="1390.6" dy="22.4">before it reaches the VPC.</tspan></text><text x="148.0" y="665.5" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="40" font-weight="400" font-style="italic" fill="#1E3A8A" text-anchor="start"><tspan x="148.0" dy="0.0">Everything fails, all the time. Build for it.</tspan></text><text x="148.0" y="707.4" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#2563EB" text-anchor="start"><tspan x="148.0" dy="0.0">— Werner Vogels</tspan></text><text x="102.0" y="594.0" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="102.0" dy="0.0">“</tspan></text><text x="1322.0" y="579.5" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#854D0E" text-anchor="start"><tspan x="1322.0" dy="0.0">Open question</tspan></text><text x="1322.0" y="611.0" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#713F12" text-anchor="start"><tspan x="1322.0" dy="0.0">Do we need a second region before the EU launch?</tspan></text><text x="1322.0" y="739.5" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#854D0E" text-anchor="start"><tspan x="1322.0" dy="0.0">Next review</tspan></text><text x="1322.0" y="771.0" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#713F12" text-anchor="start"><tspan x="1322.0" dy="0.0">Revisit the cache strategy after Q3 load tests.</tspan></text><text x="80.0" y="92.0" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="80.0" dy="0.0">Architecture decisions</tspan></text><text x="80.0" y="134.0" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="80.0" dy="0.0">Why the three-tier platform looks the way it does</tspan></text><text x="1840.0" y="60.0" font-family="&apos;Arial&apos;, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#6B7280" text-anchor="end" letter-spacing="2"><tspan x="1840.0" dy="0.0">NOTE01</tspan></text><line x1="80.0" y1="1010.0" x2="1840.0" y2="1010.0" stroke="#D1D5DB" stroke-width="1.5"/></svg>