[project]
name = "spinagram"
version = "0.6.0"
description = "Diagrams as code rendered to editable SVG, PNG, PowerPoint and Figma, with pluggable themes and backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Davi Ficanha Henrique", email = "24483153+dangerousplay@users.noreply.github.com"}]
keywords = ["diagrams", "diagram-as-code", "architecture", "svg", "powerpoint", "pptx", "figma", "figjam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "fonttools>=4.40",
    "tinycss2>=1.3",
]

[project.optional-dependencies]
pptx = ["python-pptx>=1.0", "lxml>=5.0"]
png = ["playwright>=1.40"]
vector = ["vtracer>=0.6", "resvg-py>=0.5"]
all = ["spinagram[pptx,png,vector,ui,mcp]"]
ui = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "watchfiles>=0.21",
]
mcp = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/dangerousplay/spinagram"
Documentation = "https://dangerousplay.github.io/spinagram/docs/"
Changelog = "https://github.com/dangerousplay/spinagram/blob/main/CHANGELOG.md"
Source = "https://github.com/dangerousplay/spinagram"
Issues = "https://github.com/dangerousplay/spinagram/issues"

[project.scripts]
spinagram = "spinagram.cli:main"

[project.entry-points."spinagram.backends"]
svg = "spinagram.backends.svg:SvgBackend"
png = "spinagram.backends.png:PngBackend"
pptx = "spinagram.backends.pptx:PptxBackend"
figma = "spinagram.backends.figma:FigmaBackend"
figjam = "spinagram.backends.figma:FigjamBackend"
excalidraw = "spinagram.backends.excalidraw:ExcalidrawBackend"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# spinagram is a mixed Python/Rust package: the Rust engine in rust/ compiles to the spinagram._core extension.
# Wheels are per platform (one abi3 wheel serves CPython 3.11+); elsewhere pip builds the sdist with Rust.
[tool.maturin]
manifest-path = "rust/spinagram-core-py/Cargo.toml"
python-source = "src"
module-name = "spinagram._core"
features = ["pyo3/extension-module"]
# The built web UI is ignored by git (CI builds it into place before maturin runs); wheel and sdist still carry it
include = [{ path = "src/spinagram/ui/static/**/*", format = ["sdist", "wheel"] }]

[tool.uv]
# `uv sync` rebuilds the extension when any Rust source changes
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/*/Cargo.toml" },
    { file = "rust/*/src/**/*.rs" },
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# short loop names like `l` are used on purpose in the layout engines
ignore = ["E741"]
