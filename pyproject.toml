[project]
name = "spinagram"
version = "0.1.1"
description = "Diagrams as code rendered to editable SVG, PNG, PowerPoint and Figma, with pluggable themes and backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Davi Ficanha Henrique", email = "24483153+dangerousplay@users.noreply.github.com"}]
keywords = ["diagrams", "diagram-as-code", "architecture", "svg", "powerpoint", "pptx", "figma", "figjam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "fonttools>=4.40",
    "tinycss2>=1.3",
]

[project.optional-dependencies]
pptx = ["python-pptx>=1.0", "lxml>=5.0"]
png = ["playwright>=1.40"]
vector = ["vtracer>=0.6", "resvg-py>=0.5"]
all = ["spinagram[pptx,png,vector,ui]"]
ui = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "watchfiles>=0.21",
]

[project.urls]
Homepage = "https://github.com/dangerousplay/spinagram"
Documentation = "https://dangerousplay.github.io/spinagram/docs/"
Changelog = "https://github.com/dangerousplay/spinagram/blob/main/CHANGELOG.md"
Source = "https://github.com/dangerousplay/spinagram"
Issues = "https://github.com/dangerousplay/spinagram/issues"

[project.scripts]
spinagram = "spinagram.cli:main"

[project.entry-points."spinagram.backends"]
svg = "spinagram.backends.svg:SvgBackend"
png = "spinagram.backends.png:PngBackend"
pptx = "spinagram.backends.pptx:PptxBackend"
figma = "spinagram.backends.figma:FigmaBackend"
figjam = "spinagram.backends.figma:FigjamBackend"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# hatch reads only the root .gitignore: keep the JS apps' installs and builds out of the sdist
exclude = ["**/node_modules", "docs/.next", "docs/.source", "docs/out", "web/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/spinagram"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# short loop names like `l` are used on purpose in the layout engines
ignore = ["E741"]
