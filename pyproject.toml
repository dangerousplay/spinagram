[project]
name = "diagramkit"
version = "0.1.0"
description = "Diagrams as code rendered to editable SVG, PNG, PowerPoint and Figma, with pluggable themes and backends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "fonttools>=4.40",
]

[project.optional-dependencies]
pptx = ["python-pptx>=1.0", "lxml>=5.0"]
png = ["playwright>=1.40"]
vector = ["vtracer>=0.6", "resvg-py>=0.5"]
all = ["diagramkit[pptx,png,vector,ui]"]
ui = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "watchfiles>=0.21",
]

[project.scripts]
diagramkit = "diagramkit.cli:main"

[project.entry-points."diagramkit.backends"]
svg = "diagramkit.backends.svg:SvgBackend"
png = "diagramkit.backends.png:PngBackend"
pptx = "diagramkit.backends.pptx:PptxBackend"
figma = "diagramkit.backends.figma:FigmaBackend"
figjam = "diagramkit.backends.figma:FigjamBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diagramkit"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
